[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhfo"
dynamic = ["version"]
description = "Headless EEG event detection, classification and agent interfaces"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "LicenseRef-UCLA-Academic"
license-files = ["LICENSE.txt"]
authors = [{name = "UCLA Roychowdhury Research Group"}]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "HFODetector>=0.0.23,<0.1",
    "huggingface-hub>=0.26,<2",
    "matplotlib",
    "mne",
    "numpy>=1.25,<2; python_version < '3.13'",
    "numpy>=2.1,<3; python_version >= '3.13'",
    "onnxruntime>=1.16,<2",
    "openpyxl>=3.1",
    "p-tqdm",
    "pandas",
    "Pillow",
    "scikit-image",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
severity = ["torch", "transformers>=4.45,<6", "safetensors"]
spindle = ["yasa>=0.6.5,<0.8"]
gpu = ["torch", "torchvision", "transformers>=4.45,<6", "safetensors"]
dev = ["pytest", "build", "edfio", "onnx>=1.15,<2"]

[project.urls]
Homepage = "https://github.com/roychowdhuryresearch/pyHFO"
"Project page" = "https://roychowdhuryresearch.github.io/PyHFO_Project_Page/"
Repository = "https://github.com/roychowdhuryresearch/pyHFO"
Issues = "https://github.com/roychowdhuryresearch/pyHFO/issues"

[project.scripts]
pyhfo = "pyhfo.agent_cli:main"
pyhfo-mcp = "pyhfo.agent_mcp.server:main"
pyhfo-server = "pyhfo.agent_api.server:main"

[tool.setuptools.dynamic]
version = {attr = "pyhfo._version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhfo", "pyhfo.*"]

[tool.setuptools.package-data]
pyhfo = ["resources/*.json", "resources/spindle_lsm/*.json", "agent_mcp/ui/*.html", "agent_mcp/ui/*.js", "agent_mcp/ui/*.css"]
