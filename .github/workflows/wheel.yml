name: PyHFO distribution

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build . --outdir dist
      - name: Exercise the installed core with an offline synthetic EDF
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-venv
          . wheel-venv/bin/activate
          wheel=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          python -m pip install "$wheel" pytest edfio
          PYHFO_TEST_WHEEL=1 python -m pytest -q "$GITHUB_WORKSPACE/tests/test_installed_wheel.py"
      - name: Run engine and agent tests against the wheel
        working-directory: ${{ runner.temp }}
        run: |
          . wheel-venv/bin/activate
          wheel=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install "${wheel}[dev,spindle,severity,gpu]"
          python -m pytest -q "$GITHUB_WORKSPACE/tests"
